<!--
This tool is a modification of https://github.com/wiwikuan/fast-srt-subtitle
-->

<html>
  <title>Fast and Dirty Captioner</title>

  <head>
    <meta charset="UTF-8" />

    <style>
      .video {
        width: 960px;
      }
    </style>
  </head>

  <body>
    <p>選取字幕檔以及影片檔案開始製作 SRT！</p>
    <p>你是 <label><input type="radio" name="need-reaction" value="no-need">數拍子</label> 還是 <label><input type="radio" name="need-reaction" value="need">聽到唱出來才按</label></p>
    <label>
      <span>選擇字幕檔案：</span>
      <input
        id="srtFile"
        type="file"
        name="srtFile"
        placeholder="點擊上傳字幕檔"
      />
    </label>
    <label>
      <span>選擇影片檔案：</span>
      <input
        id="videoFile"
        type="file"
        name="videoFile"
        placeholder="點擊上傳影片檔"
      />
    </label>
    <p>
      J: 這一行開始 | K: 下一行開始(*)(**) | L: 這一行提前結束 | Ctrl + Z: 回到上次操作前的狀態<br>
      I: 前捲一行 | O: 後捲一行 | U: 倒帶 2 秒 | P: 前進 2 秒 | Q: 製作 SRT 檔
    </p>
    <p>
      (*): 如果這一行還沒開始（開始的時間點是<code>null</code>），則開始這一行。<br>
      (**): 如果這一行還沒結束（結束的時間點是<code>null</code>），則在開始下一行的同時將會同時結束這一行。
    </p>
    <p id="status">Test Text.</p>
    <textarea id="textArea" rows="10" cols="80">預設的字。</textarea>
    <video class="video" id="video" controls></video>
  </body>
  <script src="./labeling.js"></script>
</html>
